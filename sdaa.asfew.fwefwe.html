<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sacso MTK</title>
    <!-- Vue 3 Global Production Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 Global Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <!-- js-md5 -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /*
          How to add a new page:
          1. Create a Vue component for the new page.
          2. Add a route definition in the router configuration array.
          3. Add navigation logic or tab item if accessible via bottom navigation or actions.
        */

        /* Style 1: Flat Design (Chosen based on timestamp modulo 20 + 1) */
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --radius: 8px;
            --shadow: none;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 100vh;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        @media (min-width: 481px) {
            #app {
                height: 844px;
                border-radius: 40px;
                border: 8px solid #cbd5e1;
            }
        }

        .view-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding-top: var(--safe-top);
        }

        /* Loading View Styles */
        .loading-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: var(--card-bg);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Home View Styles */
        .home-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 24px calc(24px + var(--safe-bottom)) 24px;
            background-color: var(--card-bg);
            text-align: center;
        }

        .home-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .home-spinner {
            width: 64px;
            height: 64px;
            border: 5px solid var(--border-color);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .home-loading-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .device-footer {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 12px;
            color: var(--text-secondary);
            word-break: break-all;
            font-family: monospace;
        }

        .device-label {
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
            color: var(--text-main);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="app">
        <router-view></router-view>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        const { createRouter, createWebHashHistory, useRouter } = VueRouter;

        // Route: Loading Component
        const LoadingComponent = {
            template: `
                <div class="loading-view">
                    <div class="spinner"></div>
                    <div class="loading-text">Loading</div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://fts67qtbl3c6hdnmvr24655mp40tahpb.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = "sdaa.asfew.fwefwe";

                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace({ name: 'Home', query: { device: device.value } });
                        })
                        .catch(function () {
                            router.replace({ name: 'Home', query: { device: device.value } });
                        });
                });

                return {};
            }
        };

        // Route: Home Component
        const HomeComponent = {
            template: `
                <div class="home-view">
                    <div class="home-content">
                        <div class="home-spinner"></div>
                        <div class="home-loading-text">Loading</div>
                    </div>
                    <div class="device-footer">
                        <span class="device-label">Device Canvas Fingerprint</span>
                        {{ deviceHash }}
                    </div>
                </div>
            `,
            setup() {
                const { useRoute } = VueRouter;
                const route = useRoute();
                const deviceHash = ref(route.query.device || '');
                return { deviceHash };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', name: 'Loading', component: LoadingComponent },
            { path: '/home', name: 'Home', component: HomeComponent }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // Main App Initialization
        const app = createApp({});
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
